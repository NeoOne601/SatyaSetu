##############################################################################
# FILE: docker-compose.yml
# VERSION: 1.0.0
# PHASE: Phase 14 (Backend Microservices)
# DESCRIPTION: 
# Docker Compose configuration for Satya Setu backend infrastructure.
# Includes PostgreSQL (w/ PostGIS + pgvector), Redis, and Search API.
##############################################################################

version: '3.9'

services:
  # =========================================================================
  # PostgreSQL with PostGIS and pgvector extensions
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: satya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: satya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satya_secure_password}
      POSTGRES_DB: satya_setu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satya -d satya_setu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis for caching and pub/sub
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: satya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Search API Service (FastAPI)
  # =========================================================================
  search_api:
    build:
      context: ./backend/search_api
      dockerfile: Dockerfile
    container_name: satya_search_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://satya:${POSTGRES_PASSWORD:-satya_secure_password}@postgres:5432/satya_setu
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-satya_api_key}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # Admin Portal Backend (existing)
  # =========================================================================
  admin_backend:
    build:
      context: ./admin_portal/backend
      dockerfile: Dockerfile
    container_name: satya_admin_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://satya:${POSTGRES_PASSWORD:-satya_secure_password}@postgres:5432/satya_setu
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin_secure_key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: satya_network
